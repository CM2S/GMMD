# What the deck kitchen_sink_2d.mdsim is converted into, with every default written out.

samples: 2
rve_dimensions: [2.0, 1.0]
seed: 7
save_min: true
phases:
  0: {type: matrix}
  1:
    type: disk
    n: {distribution: fixed, value: 5}
    r: {distribution: discrete, values: [0.05, 0.1], probabilities: [0.25, 0.75]}
  2:
    type: ellipse
    major_axis: {distribution: uniform, low: 0.1, high: 0.2}
    minor_axis: {distribution: lognormal, mean: 0.05, sigma: 0.1}
    angle: {distribution: vonmises, kappa: 2.0, loc: 0.0, scale: 1.0}
    vf: {distribution: fixed, value: 0.1}
  3:
    inside: '1'
    type: disk
    n: {distribution: fixed, value: 2}
    r: {distribution: specified, values: [0.01, 0.02]}
generation:
  min_distance: 0.001
  offset: false
  molecular_dynamics:
    max_residue_per_particle: 0.0001
    max_step: 50
    max_steps_to_relax: 3
    dt: 0.01
    dt_adapt: false
    save_history: true
    type_initial_configuration: grid
    initial_vel_coeff: 0.2
    final_overlap_check: true
    damping_coeff: 0.1
    particle_mass_opt: volume
    speed_up: {name: naive}
    thermostat:
      name: multi_temperature
      initial_temp: 100.0
      criterion: {name: rolling_ave, average_window: 10}
      temp_low_ratio: 0.5
meshes:
  gmsh:
    mesh_size: 0.05
    element_type: tri6
    periodic_constraints: false
    gauss_points: 4
    boundary_type: Linear_Condition
    formats: [links, abaqus]
    file_name: kitchen
  voxel:
    n_voxels_dims: [[16, 8], [32, 16]]
    periodic_constraints: true
    boundary_type: Periodic_Condition
    formats: [crate]
analyses:
  final_config: {}
  motion: {}
  voronoi:
    type: set
    n_surf_points: 5
    plot: true
    plot_imts: true
  statistics:
    descriptors: [nearest_neighbor, ripleys_k, two_pt_corr]
    seed: 3
