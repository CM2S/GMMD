# What the deck 3D_example_ellipsoids_vf_10_r_1_7.mdsim is converted into, with every default written out.

samples: 5
rve_dimensions: [1.0, 1.0, 1.0]
save_min: false
phases:
  0: {type: matrix}
  1:
    type: ellipsoid
    axis_1: {distribution: normal, mean: 0.125, sigma: 0.025}
    rot_axis_comp_x: {distribution: fixed, value: 0.0}
    rot_axis_comp_y: {distribution: uniform, low: -1.0, high: 1.0}
    rot_axis_comp_z: {distribution: uniform, low: -1.0, high: 1.0}
    angle: {distribution: normal, mean: 0.1, sigma: 0.2}
    ratio_12: {distribution: normal, mean: 1.7, sigma: 0.1}
    ratio_13: {distribution: normal, mean: 1.7, sigma: 0.1}
    vf: {distribution: fixed, value: 0.1}
generation:
  min_distance: 0.002
  offset: true
  inner_phase_max_step: 200
  molecular_dynamics:
    max_residue_per_particle: 0.0
    max_step: 20000
    max_steps_to_relax: 0
    dt: 0.05
    dt_adapt: true
    save_history: true
    type_initial_configuration: random
    initial_vel_coeff: 0.1
    final_overlap_check: false
    damping_coeff: 0.0
    particle_mass_opt: radius
    speed_up: {name: verlet, factor: 1.1}
    thermostat:
      name: multi_temperature
      criterion: {name: ratio_in_out, max_ratio_osc: 2}
      temp_low_ratio: 0.25
meshes:
  voxel:
    n_voxels_dims: [70, 70, 70]
    periodic_constraints: true
    boundary_type: Periodic_Condition
analyses:
  final_config: {}
  motion: {}
