# 3D example
# A microstructure of cylindrical fibres of radius 0.05 along z, filling 30% of a
# 1 x 1 x 2 RVE, kept 0.002 apart, generated by a molecular dynamics simulation.

samples: 1
rve_dimensions: [1, 1, 2]

phases:
  0: {type: matrix}
  1: {type: cylindrical_fiber, r: 0.05, vf: 0.3, direction: 2}

generation:
  min_distance: 0.002
  molecular_dynamics:
    max_residue_per_particle: 0
    max_step: 200
    speed_up: naive
    save_history: true

analyses:
  final_config: true
