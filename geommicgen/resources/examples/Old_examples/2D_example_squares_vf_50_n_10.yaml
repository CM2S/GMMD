# 2D example
# A microstructure of squares filling 20% of a 1.9 x 1 RVE, their side drawn from a
# normal distribution, kept 0.05 apart, generated by a molecular dynamics simulation.
# The square particle is not in master yet.

samples: 1
rve_dimensions: [1.9, 1]

phases:
  0: {type: matrix}
  1:
    type: square
    vf: 0.2
    side: {distribution: normal, mean: 0.1, sigma: 0.02}

generation:
  min_distance: 0.05
  molecular_dynamics:
    max_residue_per_particle: 0
    max_step: 50
    speed_up: {name: verlet, factor: 1.1}
    save_history: true

meshes:
  voxel: {n_voxels_dims: [1000, 1000]}

analyses:
  final_config: true
