# 3D example
# A microstructure of cylinders and spheres, each filling 5% of a 1 x 1 x 2 RVE, kept
# 0.002 apart, generated by a molecular dynamics simulation.

samples: 1
rve_dimensions: [1, 1, 2]

phases:
  0: {type: matrix}
  1:
    type: cylinder
    r_cyl: 0.05
    length: 0.1
    azimuth_angle: 0
    polar_angle: 15
    vf: 0.05
  2: {type: sphere, r: 0.04, vf: 0.05}

generation:
  min_distance: 0.002
  molecular_dynamics:
    max_residue_per_particle: 0
    max_step: 200
    speed_up: {name: verlet, factor: 1.1}
    save_history: true

analyses:
  final_config: true
