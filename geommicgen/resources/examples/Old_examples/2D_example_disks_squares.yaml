# 2D example
# A microstructure of two phases in a 1 x 1 RVE: disks of radius 0.05 filling 20%, and
# squares filling 20% whose side is drawn from a normal distribution, kept 0.005 apart,
# generated by a molecular dynamics simulation.
# The square particle is not in master yet.

samples: 1
rve_dimensions: [1, 1]

phases:
  0: {type: matrix}
  1: {type: disk, r: 0.05, vf: 0.2}
  2:
    type: square
    vf: 0.2
    side: {distribution: normal, mean: 0.1, sigma: 0.01}

generation:
  min_distance: 0.005
  molecular_dynamics:
    max_residue_per_particle: 0
    max_step: 100
    speed_up: {name: verlet, factor: 1.1}
    save_history: true

# meshes:
#   voxel: {n_voxels_dims: [1000, 1000]}

analyses:
  final_config: true
