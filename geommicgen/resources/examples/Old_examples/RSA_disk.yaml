# 2D example
# A microstructure of disks of radius 0.04 filling 30% of a 1.5 x 1.2 RVE, generated by
# a random sequential adsorption.
# The random sequential adsorption is not in master yet.

samples: 1
rve_dimensions: [1.5, 1.2]

phases:
  0: {type: matrix}
  1: {type: disk, r: 0.04, vf: 0.3}

generation:
  random_sequential_adsorption:
    max_step: 10000
    save_history: true

analyses:
  final_config: true
