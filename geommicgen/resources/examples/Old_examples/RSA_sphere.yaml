# 3D example
# A microstructure of spheres of radius 0.04 filling 5% of a 1.2 x 0.9 x 0.7 RVE, kept
# 0.002 apart, generated by a random sequential adsorption.
# The random sequential adsorption is not in master yet.

samples: 1
rve_dimensions: [1.2, 0.9, 0.7]

phases:
  0: {type: matrix}
  1: {type: sphere, r: 0.04, vf: 0.05}

generation:
  min_distance: 0.002
  random_sequential_adsorption:
    max_step: 20000
    speed_up: cell

# meshes:
#   voxel: {n_voxels_dims: [70, 70, 70]}

analyses:
  final_config: true
