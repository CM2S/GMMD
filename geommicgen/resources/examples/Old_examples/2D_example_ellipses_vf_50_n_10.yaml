# 2D example
# A microstructure of 30 ellipses in a 1 x 2 RVE, of major axis 0.2 and ratio of their
# axes 1.5, their angle drawn from a normal distribution, generated by a molecular
# dynamics simulation, with their Voronoi diagram.

samples: 1
rve_dimensions: [1, 2]

phases:
  0: {type: matrix}
  1:
    type: ellipse
    n: 30
    major_axis: 0.2
    ratio: 1.5
    angle: {distribution: normal, mean: 0, sigma: 0.2}

generation:
  molecular_dynamics:
    max_residue_per_particle: 0
    max_step: 100
    speed_up: {name: verlet, factor: 1.1}
    save_history: true

meshes:
  voxel: {n_voxels_dims: [1000, 1000]}

analyses:
  final_config: true
  voronoi: {plot: true}
  # statistics:
  #   descriptors: [nearest_neighbor, ripleys_k, two_pt_corr]
