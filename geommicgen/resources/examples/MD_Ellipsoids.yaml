# 3D example
# A microstructure of ellipsoids filling 10% of a 1 x 1 x 1 RVE, kept 0.002 apart,
# generated by a molecular dynamics simulation. Axis 1 and its ratios to axes 2 and 3
# are drawn from normal distributions, and each ellipsoid is rotated about an axis in
# the yz plane drawn at random, by an angle drawn from a normal distribution.

samples: 1
rve_dimensions: [1, 1, 1]

phases:
  0: {type: matrix}
  1:
    type: ellipsoid
    vf: 0.1
    axis_1: {distribution: normal, mean: 0.125, sigma: 0.025}
    ratio_12: {distribution: normal, mean: 1.7, sigma: 0.1}
    ratio_13: {distribution: normal, mean: 1.7, sigma: 0.1}
    rot_axis_comp_x: 0
    rot_axis_comp_y: {distribution: uniform, low: -1, high: 1}
    rot_axis_comp_z: {distribution: uniform, low: -1, high: 1}
    angle: {distribution: normal, mean: 0.1, sigma: 0.2}

generation:
  min_distance: 0.002
  molecular_dynamics:
    max_residue_per_particle: 0
    max_step: 200
    speed_up: {name: verlet, factor: 1.1}
    save_history: true

# meshes:
#   voxel: {n_voxels_dims: [70, 70, 70]}

analyses:
  final_config: true
  motion: true
