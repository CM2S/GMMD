# Disks and randomly oriented ellipses, 55 % in all
samples: 1
rve_dimensions: [1, 1]
seed: 3

phases:
  0: {type: matrix}
  1: {type: disk, r: {distribution: normal, mean: 0.045, sigma: 0.005}, vf: 0.3}
  2: {type: ellipse, n: 30, vf: 0.25, ratio: 2.2, angle: {distribution: uniform, low: 0, high: 3.1416}}

generation:
  min_distance: 0.008
  molecular_dynamics:
    max_residue_per_particle: 0
    max_step: 5000
    speed_up: {name: verlet, factor: 1.1}
