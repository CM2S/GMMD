# 2D example
# A microstructure of squares filling 40% of a 1.9 x 1 RVE, their side drawn from a
# normal distribution, kept 0.005 apart, generated by a random sequential adsorption,
# with the statistical descriptors of their arrangement.

samples: 1
rve_dimensions: [1.9, 1]
seed: 1

phases:
  0: {type: matrix}
  2:
    type: square
    vf: 0.4
    side: {distribution: normal, mean: 0.1, sigma: 0.01}

generation:
  min_distance: 0.005
  random_sequential_adsorption:
    max_step: 10000
    speed_up: cell
    save_history: true

# meshes:
#   voxel: {n_voxels_dims: [1000, 1000]}

analyses:
  final_config: true
  statistics:
    descriptors: [nearest_neighbor, ripleys_k, two_pt_corr]
