# 2D example
# A microstructure of 100 ellipses filling 50% of a 1 x 1 RVE, the ratio of their axes
# 2 and their angle drawn from a normal distribution, generated by a molecular dynamics
# simulation.

samples: 1
rve_dimensions: [1, 1]
seed: 1

phases:
  0: {type: matrix}
  1:
    type: ellipse
    n: 100
    vf: 0.5
    angle: {distribution: normal, mean: 0, sigma: 0.2}
    ratio: 2

generation:
  molecular_dynamics:
    max_residue_per_particle: 0
    max_step: 100
    speed_up: {name: verlet, factor: 1.1}
    save_history: true

# meshes:
#   voxel: {n_voxels_dims: [1000, 1000]}

analyses:
  final_config: true
