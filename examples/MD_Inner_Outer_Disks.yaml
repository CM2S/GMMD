# 2D example
# A microstructure of three phases in a 1 x 1 RVE: the matrix, disks of radius 0.08
# filling 40% of it, generated by a molecular dynamics simulation and kept 0.005 apart,
# and small disks of radius 0.015 filling 4%, placed inside the larger ones.

samples: 1
rve_dimensions: [1, 1]
seed: 1

phases:
  0: {type: matrix}
  1: {type: disk, r: 0.08, vf: 0.4}
  2: {type: disk, r: 0.015, vf: 0.04, inside: 1}

generation:
  min_distance: 0.005
  molecular_dynamics:
    max_residue_per_particle: 0
    max_step: 100
    speed_up: {name: verlet, factor: 1.1}
    save_history: true

# meshes:
#   voxel: {n_voxels_dims: [1000, 1000]}

analyses:
  final_config: true
