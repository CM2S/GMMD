# 2D example
# A microstructure of disks filling 50% of a 1 x 1 RVE, their radius drawn from a
# discrete distribution, kept 0.005 apart, generated by a molecular dynamics simulation.

samples: 1
rve_dimensions: [1, 1]
seed: 1

phases:
  0: {type: matrix}
  1:
    type: disk
    vf: 0.5
    r: {distribution: discrete, values: [0.05, 0.02, 0.1], probabilities: [0.4, 0.5, 0.1]}

generation:
  min_distance: 0.005
  molecular_dynamics:
    max_residue_per_particle: 0
    max_step: 100
    speed_up: {name: verlet, factor: 1.1}
    save_history: true

# meshes:
#   voxel: {n_voxels_dims: [1000, 1000]}

analyses:
  final_config: true
  simulation_gif: {}
