# 3D example
# A microstructure of ellipsoids filling 10% of a 1.2 x 0.8 x 0.7 RVE, generated by a
# random sequential adsorption and kept 0.002 apart. The first axis and the ratios of it
# to the others are drawn from normal distributions, and the orientation at random.

samples: 1
rve_dimensions: [1.2, 0.8, 0.7]

phases:
  0: {type: matrix}
  1:
    type: ellipsoid
    vf: 0.1
    axis_1: {distribution: normal, mean: 0.125, sigma: 0.025}
    ratio_12: {distribution: normal, mean: 1.7, sigma: 0.1}
    ratio_13: {distribution: normal, mean: 1.7, sigma: 0.1}
    rot_axis_comp_x: 0
    rot_axis_comp_y: {distribution: uniform, low: -1, high: 1}
    rot_axis_comp_z: {distribution: uniform, low: -1, high: 1}
    angle: {distribution: normal, mean: 0.1, sigma: 0.2}

generation:
  min_distance: 0.002
  random_sequential_adsorption:
    max_step: 20000

# meshes:
#   voxel: {n_voxels_dims: [70, 70, 70]}

analyses:
  final_config: true
