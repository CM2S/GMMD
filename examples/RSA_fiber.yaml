# 3D example
# A microstructure of cylindrical fibres of radius 0.05 along z, filling 30% of a
# 1 x 1 x 2 RVE, kept 0.002 apart, generated by a random sequential adsorption, with the
# volume fraction it reached plotted step by step.
# The random sequential adsorption is not in master yet.

samples: 1
rve_dimensions: [1, 1, 2]

phases:
  0: {type: matrix}
  1: {type: cylindrical_fiber, r: 0.05, vf: 0.3, direction: 2}

generation:
  min_distance: 0.002
  random_sequential_adsorption:
    max_step: 10000
    speed_up: cell
    save_history: true

analyses:
  final_config: true
  rsa_history: {}
